services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://scoreboard:scoreboard@db:5432/scoreboard
      - REDIS_URL=redis://cache:6379/0
    depends_on:
      - db
      - cache
    volumes:
      # le code est monté en direct : tu modifies un fichier, uvicorn recharge, sans rebuild
      - ./api/app:/code/app
      - ./api/tests:/code/tests

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scoreboard
      POSTGRES_PASSWORD: scoreboard
      POSTGRES_DB: scoreboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
